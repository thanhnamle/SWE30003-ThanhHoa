name: Keep Services Alive

on:
  schedule:
    # Chạy mỗi 10 phút một lần
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt bằng tay trên GitHub

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Render
        run: |
          echo "Pinging Render to keep it awake..."
          curl -s -o /dev/null -w "%{http_code}" -X GET "https://swe30003-thanhhoa.onrender.com/swagger/index.html"
          echo -e "\nPing completed!"
